[package]
name = "indexer"
version = "0.1.0"
edition = "2021"

[dependencies]
# Starknet
starknet-providers = "0.12"
starknet-core = "0.12"

# GraphQL
async-graphql = "7.0"
async-graphql-axum = "7.0"
async-graphql-warp = "7.0"

# Web server
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }

# Database
rusqlite = { version = "0.31", features = ["bundled"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Environment
dotenv = "0.15"
anyhow = "1.0"
thiserror = "1.0"

# Utilities
hex = "0.4"
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.11", features = ["json"] }
async-stream = "0.3"
url = "2.5"
